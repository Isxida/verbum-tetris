server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # words.txt (7.6 MB) y las definiciones JSON pesan unas 5 veces menos comprimidos.
  # El mp3 y la fuente woff2 ya vienen comprimidos, por eso no están en la lista.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any; # detrás del proxy de Dokploy no se debe saltar la compresión
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # index.html, words.txt y defs/ no llevan hash en el nombre: se revalidan siempre (ETag, respuesta 304 barata)
  location / {
    add_header Cache-Control "no-cache";
  }

  # Lo que genera Vite lleva hash en el nombre (JS, CSS, fuente y música): no cambia nunca
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
