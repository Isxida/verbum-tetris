# Este archivo se incluye dentro de http { }, por eso aquí van los límites por IP.
# Zonas compartidas (10 MB guardan unas 160,000 IPs cada una).
limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # ── IP real del visitante ────────────────────────────────────────────────────
  # El dominio pasa por Cloudflare y luego por el proxy de Dokploy: aquí todas las peticiones llegan desde la IP interna
  # del proxy (10.x.x.x) y Cloudflare entrega la IP del visitante en la cabecera CF-Connecting-IP. Solo se confía en ella
  # cuando la petición viene de una red privada (el proxy). Ojo: quien llegue directo al servidor sin pasar por Cloudflare
  # puede falsearla; por eso el firewall del VPS debe aceptar los puertos 80 y 443 solo desde las IPs de Cloudflare.
  # Sin esto, el límite por IP trataría a todos los visitantes de una misma IP de Cloudflare como una sola persona.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  # ── Fuerza bruta y abuso ─────────────────────────────────────────────────────
  # Una carga normal de la página son ~15 peticiones seguidas; las ráfagas de más de 150 y los más de 40 en curso
  # por IP se rechazan con 429. Los límites son holgados a propósito, por si varias personas comparten una IP.
  limit_req zone=por_ip burst=150 nodelay;
  limit_req_status 429;
  limit_conn conexiones 40;

  # Sitio estático: no hay formularios ni subidas, así que cualquier otro método es un sondeo. 444 = cerrar la
  # conexión sin responder nada.
  if ($request_method !~ ^(GET|HEAD)$) {
    return 444;
  }
  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;

  # words.txt (7.6 MB) y las definiciones JSON pesan unas 5 veces menos comprimidos.
  # El mp3 y la fuente woff2 ya vienen comprimidos, por eso no están en la lista.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any; # detrás del proxy de Dokploy no se debe saltar la compresión
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # ── Solo se sirve lo que existe ──────────────────────────────────────────────
  # Todo lo demás (/wp-login.php, /.env, /admin, /api, /phpmyadmin, /actuator…) es un sondeo de bots y se corta sin
  # responder. En vez de mantener una lista de patrones prohibidos, se permite una lista corta y lo nuevo queda
  # bloqueado por defecto. Si algún día se publica otro archivo en public/, hay que agregarlo aquí.
  location / {
    return 444;
  }

  # Peticiones inofensivas de navegadores y buscadores (íconos, robots.txt): 404 normal y sin ruido en el log. Con 444 el
  # proxy devolvería un 502, y un 5xx en robots.txt puede hacer que los buscadores pausen el rastreo del sitio.
  location ~ ^/(?:favicon\.ico|robots\.txt|sitemap\.xml|apple-touch-icon[^/]*\.png)$ {
    access_log off;
    return 404;
  }

  # index.html, words.txt, favicon.svg y defs/*.json no llevan hash en el nombre: se revalidan siempre
  # (ETag, respuesta 304 barata). "/" sirve index.html.
  location = / {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(?:index\.html|words\.txt|favicon\.svg|defs/[^/]+\.json)$ {
    add_header Cache-Control "no-cache";
  }

  # Lo que genera Vite lleva hash en el nombre (JS, CSS, fuente y música): no cambia nunca
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
